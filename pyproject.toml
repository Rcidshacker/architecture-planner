[project]
name = "architect"
version = "0.1.0"
description = "Provider-aware, evidence-grounded architecture planner (V1 CLI)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.scripts]
architect = "architect.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "pyyaml>=6", "types-pyyaml"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls the real claude CLI (run with -m integration)"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
